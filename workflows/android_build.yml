name: Android Build CI

# Triggers the workflow on any push or pull request to the main branch
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    # Use a pre-configured Ubuntu runner provided by GitHub (includes Android SDK)
    runs-on: ubuntu-latest

    steps:
    # Step 1: Check out the code from your repository
    - name: Checkout Repository
      uses: actions/checkout@v4

    # Step 2: Set up Java Development Kit (JDK) 17 (or your required version)
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: 'gradle' # Automatically caches Gradle dependencies to speed up future builds

    # Step 3: Grant execute permission to the Gradle wrapper script
    - name: Grant Execute Permission to Gradle
      run: chmod +x gradlew

    # Step 4: Run unit tests to ensure your code works properly
    - name: Run Tests
      run: ./gradlew test

    # Step 5: Build the application (Generates an APK or AAB file)
    - name: Build with Gradle
      run: ./gradlew assembleDebug

    # Step 6: Save the generated APK as an artifact so you can download it
    - name: Upload APK Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: debug-apk
        path: app/build/outputs/apk/debug/app-debug.apk
